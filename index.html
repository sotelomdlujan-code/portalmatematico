html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 var(--fb);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;max-width:1120px;margin:auto}
aside{padding:28px 20px;position:sticky;top:0;align-self:start}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.mark{width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center;font:600 1.5rem/1 var(--fd)}
.brand h1{margin:0;font:600 1.3rem/1.15 var(--fd);letter-spacing:-.01em}
.role{color:var(--mu);font-size:.88rem;margin:0 0 24px 56px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--tx);padding:11px 14px;border-radius:14px;cursor:pointer;font:600 .98rem var(--fb)}
nav button .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.95rem}
nav button .n{margin-left:auto;color:var(--mu);font-weight:400;font-size:.85rem}
nav button.on{background:var(--sf);box-shadow:var(--sh)}
nav button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.k-plans .dot,.k-plans.tagk{background:var(--plans-bg);color:var(--plans-ink)}
.k-exams .dot,.k-exams.tagk{background:var(--exams-bg);color:var(--exams-ink)}
.k-materials .dot,.k-materials.tagk{background:var(--materials-bg);color:var(--materials-ink)}
.k-tasks .dot,.k-tasks.tagk{background:var(--tasks-bg);color:var(--tasks-ink)}
main{padding:36px 28px 64px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.top h2{margin:0;font:600 2rem/1.15 var(--fd);letter-spacing:-.015em}
.lead{color:var(--mu);margin:6px 0 22px;max-width:56ch}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select.cur{font:600 .9rem var(--fb);padding:9px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);width:auto}
.btn{border:0;background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:12px;cursor:pointer;font:700 .92rem var(--fb)}
.btn.soft{background:var(--plans-bg);color:var(--plans-ink)}
.btn.del{background:transparent;color:var(--dg)}
.item{background:var(--sf);border-radius:20px;box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:14px;overflow:hidden}
.item summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:18px 20px}
.item summary::-webkit-details-marker{display:none}
.badge{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem}
.item h3{margin:0;font:600 1.15rem/1.3 var(--fd)}
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:.8rem;font-weight:600;padding:2px 11px;border-radius:999px;background:var(--sf2);border:1px solid var(--bd);color:var(--mu)}
.chip.tagk{border-color:transparent}
.chev{margin-left:auto;color:var(--mu);transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.body{padding:2px 22px 20px 80px;border-top:1px solid var(--bd);margin-top:0}
.f{margin-top:16px}
.f b{display:block;font:600 .95rem var(--fd);color:var(--ac);margin-bottom:2px}
.f p{margin:0;white-space:pre-wrap;max-width:68ch}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.files a{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-weight:600;font-size:.88rem;padding:7px 13px;border-radius:12px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx)}
.acts{display:flex;gap:8px;margin-top:18px}
.empty{background:var(--sf);border:1px dashed var(--bd);border-radius:20px;text-align:center;padding:48px 20px;color:var(--mu)}
.empty .big{font:600 1.25rem var(--fd);color:var(--tx);margin-bottom:4px}
dialog{border:0;border-radius:24px;background:var(--sf);color:var(--tx);width:min(600px,94vw);padding:26px;max-height:92vh;box-shadow:0 24px 64px rgba(30,25,80,.35)}
dialog::backdrop{background:rgba(30,25,70,.45)}
dialog h3{margin:0 0 6px;font:600 1.5rem var(--fd)}
label{display:block;font-size:.86rem;font-weight:700;margin:14px 0 5px}
input,textarea,select{width:100%;font:inherit;padding:10px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--sf2);color:var(--tx)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:.84rem;color:var(--mu);margin-top:6px}
.note a{color:var(--ac)}
@media (max-width:760px){
 .app{grid-template-columns:1fr}
 aside{position:static;padding:20px 16px 0}
 .role{margin-bottom:14px}
 nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
 nav button{width:auto;white-space:nowrap;padding:9px 12px}
 nav button .n{display:none}
 main{padding:20px 16px 56px}
 .top h2{font-size:1.6rem}
 .body{padding:2px 18px 18px}
 .row{grid-template-columns:1fr}
}
.auth{margin-top:22px;padding:0 6px}
.auth .who{font-size:.82rem;color:var(--mu);margin:0 0 8px;word-break:break-all}
.auth .btn{width:100%}
.err{color:var(--dg);font-size:.88rem;margin-top:10px;min-height:1.2em}
.setup{max-width:60ch}
.setup code{background:var(--sf2);border:1px solid var(--bd);padding:1px 6px;border-radius:6px}
@media (max-width:760px){.auth{display:flex;gap:10px;align-items:center;margin-top:10px}.auth .who{margin:0;flex:1}.auth .btn{width:auto}}
.k-gen .dot{background:var(--tasks-bg);color:var(--tasks-ink)}
.gcfg{padding:6px 22px 22px}.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.gtopics{display:flex;flex-wrap:wrap;gap:8px}.chipsel{display:inline-block;margin:0;font-weight:600}
.chipsel input{position:absolute;opacity:0;width:0}.chipsel span{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--sf2);cursor:pointer;font-size:.9rem}
.chipsel input:checked+span{background:var(--ac);color:var(--acx);border-color:var(--ac)}.chipsel input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
label.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin-top:12px}label.chk input{width:auto}
.gbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.sheet{background:#fff;color:#1f1f2e;border-radius:6px;padding:34px 40px;margin-bottom:22px;box-shadow:var(--sh);font:400 16px/1.6 "Nunito Sans",Georgia,serif}
.sheet h2{font:600 1.4rem var(--fx);text-align:center;margin:10px 0}
.sh-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #1f1f2e;padding-bottom:8px}
.sh-line{margin:14px 0 6px}.sh-info{font-size:.9rem;color:#444;margin:6px 0 18px}
.ex{margin-bottom:12px;break-inside:avoid}.ex-q{margin-top:2px;line-height:2}.pt{color:#555;font-size:.88rem}
.rr{border:0;background:#eee;border-radius:8px;cursor:pointer;margin-left:6px}
.kr{margin-bottom:10px;line-height:1.8}.kt{color:#555;font-size:.85rem}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px;font-size:.9em;line-height:1.25}
.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:1px solid currentColor}
@media (max-width:760px){.sheet{padding:20px 16px}}
@media print{aside,.top,.lead,.gcfg,.noprint{display:none!important}body{background:#fff}.app{display:block}main{padding:0}.sheet{box-shadow:none;margin:0;padding:0}
body.pk .sheet-exam{display:none}body:not(.pk) .sheet-key{display:none}}
.picker{margin:0 0 18px;padding:0 4px}.picker label{font-size:.78rem;color:var(--mu);margin:10px 0 4px}
.pk{display:flex;gap:4px;align-items:center}.pk select{flex:1;min-width:0;padding:8px 10px;font-size:.9rem}
.ib{flex:none;width:32px;height:32px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;cursor:pointer;font-size:.85rem;padding:0}
.ib:hover{background:var(--sf2)}.ib:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn.lnk{width:100%;margin-top:12px;font-size:.85rem}.btn:disabled{opacity:.5;cursor:default}
@media (max-width:760px){.picker{padding:0}}

/* ===== Tema: cuaderno y pizarrón ===== */
body{--kc:var(--plans-ink);--kb:var(--plans-bg);--kh:var(--plans-hl);background-color:var(--bg);background-image:var(--doodles),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:420px 420px,26px 26px,26px 26px;font-size:17px}
body[data-tab=exams]{--kc:var(--exams-ink);--kb:var(--exams-bg);--kh:var(--exams-hl)}
body[data-tab=materials]{--kc:var(--materials-ink);--kb:var(--materials-bg);--kh:var(--materials-hl)}
body[data-tab=tasks],body[data-tab=gen]{--kc:var(--tasks-ink);--kb:var(--tasks-bg);--kh:var(--tasks-hl)}
.app{grid-template-columns:300px 1fr;max-width:1180px}
/* pizarrón */
aside{background-color:var(--board);background-image:linear-gradient(135deg,rgba(255,255,255,.08),transparent 45%),radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.6px);background-size:auto,9px 9px;color:var(--chalk);margin:18px 0 18px 16px;padding:20px 16px 14px;border:10px solid var(--wood);border-radius:20px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1),inset 0 0 70px rgba(0,0,0,.28),0 6px 0 rgba(38,50,77,.18);position:static}
@media (min-width:761px) and (min-height:900px){aside{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto}}
.mark{background:transparent;border:3px dashed var(--chalk);color:var(--chalk);font:400 1.7rem/1 var(--fd)}
.brand h1{color:var(--chalk);font:400 1.65rem/1.05 var(--fd);letter-spacing:0}
.role{color:rgba(246,243,232,.78);margin-left:0;font-size:.9rem}
nav button{color:var(--chalk);font:400 1.2rem var(--fd);border-radius:14px;padding:9px 14px}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:rgba(255,255,255,.13);box-shadow:none;outline:2px dashed rgba(246,243,232,.6);outline-offset:-3px}
nav button .n{color:rgba(246,243,232,.7)}
nav button .dot{border-radius:50%;border:2px solid rgba(0,0,0,.35)}
nav button:focus-visible,aside .btn:focus-visible,aside select:focus-visible,aside .ib:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.picker label{color:rgba(246,243,232,.85);font:400 1.05rem var(--fd);margin:8px 0 3px}
aside .pk select,aside .ib{background:rgba(255,255,255,.1);color:var(--chalk);border:1.5px solid rgba(246,243,232,.5);border-radius:10px}
aside .pk select option{color:#222;background:#fff}
aside .ib:hover{background:rgba(255,255,255,.22)}
aside .btn{border-color:#101a16;box-shadow:0 3px 0 rgba(0,0,0,.45)}
aside .btn:active{box-shadow:0 0 0 rgba(0,0,0,.45)}
.auth .who{color:rgba(246,243,232,.8)}
.lapi-side{display:flex;justify-content:center;margin-top:8px}.lapi-side .lapi{width:84px}
aside::after{content:"";display:block;height:12px;margin:4px 4px 0;border-radius:5px;background:linear-gradient(90deg,transparent 0 10%,#f6f3e8 10% 26%,transparent 26% 33%,#ffe066 33% 46%,transparent 46% 66%,#9aa5a0 66% 86%,transparent 86%),var(--wood);box-shadow:0 2px 0 rgba(0,0,0,.3)}
/* hoja cuadriculada con margen */
main{position:relative;padding:34px 28px 64px 50px}
main::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:6px;border-left:2px solid var(--margin);border-right:2px solid var(--margin);pointer-events:none}
.top h2{display:inline-block;font:400 2.6rem/1.1 var(--fd);letter-spacing:0;padding:0 .2em;margin-left:-.2em;background:linear-gradient(transparent 56%,var(--kh) 56% 90%,transparent 90%)}
.lead{font:400 1.25rem/1.35 var(--fd);color:var(--mu)}
/* botones tipo marcador */
.btn{border:2px solid var(--ink);background:var(--ac);color:var(--acx);padding:9px 18px;border-radius:14px;box-shadow:0 3px 0 var(--ink);font:700 .95rem var(--fb);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.soft{background:var(--hl);color:#2b2b2b}
.btn.del{background:transparent;color:var(--dg);border-color:transparent;box-shadow:none}
.btn.del:hover,.btn.del:active{transform:none;box-shadow:none;text-decoration:underline}
.btn:disabled{opacity:.5;box-shadow:none;transform:none}
.btn:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
select.cur{border:2px solid var(--ink);border-radius:12px}
/* tarjetas: hojas pegadas con cinta */
.item{position:relative;overflow:visible;margin:22px 0 18px;background:var(--sf);border:2px solid var(--ink);border-left:10px solid var(--kc);border-radius:6px 18px 18px 6px;box-shadow:4px 4px 0 rgba(38,50,77,.16)}
.item::before{content:"";position:absolute;top:-11px;left:36px;width:74px;height:20px;background:var(--kh);opacity:.92;transform:rotate(-3deg);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.18);pointer-events:none}
.item h3{font:400 1.5rem/1.2 var(--fd)}
.badge{border:2px solid var(--ink);border-radius:50%}
.body{border-top:2px dashed var(--bd)}
.f b{font:400 1.2rem var(--fd);color:var(--kc)}
.chip{border:1.5px dashed var(--mu);background:transparent}.chip.tagk{border:1.5px solid transparent}
.files a{border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(38,50,77,.2);background:var(--sf2);transition:transform .08s}
.files a:hover{transform:translate(-1px,-1px)}
.empty{background:var(--sf2);border:3px dashed var(--bd);border-radius:22px;padding:30px 20px 38px}
.empty .big{font:400 1.8rem/1.2 var(--fd);color:var(--tx)}
.empty .lapi{display:block;width:104px;margin:0 auto 4px}
/* formularios y diálogos */
input,textarea,select{border:2px solid var(--ink);border-radius:12px;background:var(--sf)}
input:focus,textarea:focus,select:focus{outline:3px solid var(--ac);outline-offset:1px}
label{font-weight:700}
.chipsel span{border:2px dashed var(--mu);background:var(--sf)}
.chipsel input:checked+span{background:var(--hl);color:#2b2b2b;border:2px solid var(--ink)}
.chipsel input:checked+span::before{content:"✓ ";font-weight:800}
dialog{border:3px solid var(--ink);border-radius:22px;box-shadow:10px 10px 0 rgba(38,50,77,.28)}
dialog::backdrop{background:rgba(20,33,28,.55)}
dialog h3{font:400 2.1rem/1.1 var(--fd)}
.lh{display:flex;align-items:center;gap:12px}.lh .lapi{width:62px;flex:none}.lh h3{margin:0}.lh p{margin:0;font:400 1.15rem var(--fd);color:var(--mu)}
.gcfg{border-radius:6px 18px 18px 6px}
/* movimiento (se apaga si la persona lo prefiere) */
.lapi .wave{transform-origin:92px 92px;animation:lapi-wave 3.4s ease-in-out infinite}
.empty .lapi{animation:lapi-bob 3.2s ease-in-out infinite}
@keyframes lapi-wave{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-16deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-14deg)}}
@keyframes lapi-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (hover:hover) and (prefers-reduced-motion:no-preference){.item{transition:transform .15s}.item:hover{transform:rotate(-.3deg)}}
@media (prefers-reduced-motion:reduce){.lapi .wave,.empty .lapi{animation:none}.btn,.files a,.item{transition:none}}
@media (max-width:760px){
 .app{grid-template-columns:1fr}
 aside{margin:12px 12px 0;border-width:6px;padding:14px 12px 10px;max-height:none;top:0}
 .lapi-side{display:none}aside::after{display:none}
 main{padding:20px 14px 56px 30px}main::before{left:10px}
 .top h2{font-size:2.1rem}
 nav button{font-size:1.1rem}
}
@media print{body{background:#fff!important;background-image:none!important}main{padding:0!important}main::before,.item::before,aside::after{display:none!important}}

/* ===== Hoja del examen: figuras, recordatorios y apartados ===== */
.ex-body{display:flex;gap:18px;align-items:flex-start}
.ex-body .ex-q{flex:1;min-width:0}
.ex-body.wide{flex-direction:column;gap:4px}
.ex-fig,.kfig{flex:none;max-width:100%}
.ex-fig svg,.kfig svg{max-width:100%;height:auto;display:block;color:#1f1f2e}
.kfig{margin:4px 0 6px}
.ex-tip{margin-top:6px;font-size:.86em;line-height:1.45;color:#4a4a58;font-style:italic}
.sub{margin:2px 0 2px 6px;line-height:2}
.blank{display:inline-block;min-width:150px;border-bottom:1px dashed #1f1f2e;vertical-align:baseline;height:1em}
.blank.wide{min-width:260px}
.box{display:inline-block;width:38px;height:24px;border:1.5px solid #1f1f2e;border-radius:3px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;max-width:560px}
.ex-q .fr,.kr .fr{vertical-align:middle}
@media (max-width:640px){.ex-body{flex-direction:column;gap:4px}.grid2{grid-template-columns:1fr}}
@media print{.ex-body{display:flex}.ex-body.wide{flex-direction:column}.ex-tip{color:#333}}

/* ===== Biblioteca ===== */
.k-lib .dot{background:var(--materials-bg);color:var(--materials-ink)}
body[data-tab=lib]{--kc:var(--materials-ink);--kb:var(--materials-bg);--kh:var(--materials-hl)}
.lb-search{padding-top:14px}
.lb-row{display:flex;gap:16px;flex-wrap:wrap}.lb-f{flex:1;min-width:230px}
.lb-opts{margin:8px 0 2px}.lb-opts .chk{margin:0 12px 0 0}
.lb-books{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px}.lb-books>span{font-weight:700;margin-right:4px}
.lb-note{margin:12px 0;padding:10px 14px;border:2px dashed var(--bd);border-radius:14px;background:var(--sf2);font-size:.92rem}
.lb-sum{margin:18px 0 8px;font-size:1.02rem;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.lb-g{margin:16px 0}.lb-bt{font:400 1.6rem/1.2 var(--fd);margin:14px 0 8px}.lb-bt small{font:600 .85rem var(--fb);color:var(--mu);margin-left:6px}
.lb-res{background:var(--sf);border:2px solid var(--ink);border-left:8px solid var(--kc);border-radius:6px 16px 16px 6px;padding:10px 14px;margin:0 0 12px;box-shadow:3px 3px 0 rgba(38,50,77,.14)}
.lb-pg{display:flex;align-items:center;gap:8px;font-size:1rem;cursor:pointer;width:fit-content;margin:0}
.lb-pg input[type=checkbox]{width:18px;height:18px;margin:0;padding:0;flex:none;accent-color:var(--ac)}
.lb-st{flex:1;min-width:240px}.lb-print .btn{margin-left:4px}
.lb-snip{margin:6px 0 8px;line-height:1.55;color:var(--tx)}
.lb-snip mark,.lb-full mark{background:var(--kh);color:inherit;padding:0 2px;border-radius:3px}
.lb-act .btn{padding:6px 12px;font-size:.84rem;margin-right:6px}
.lb-full{margin-top:8px}.lb-full pre,#lbv-b pre{white-space:pre-wrap;font:inherit;line-height:1.55;background:var(--sf2);border:1.5px dashed var(--bd);border-radius:10px;padding:10px 12px;max-height:420px;overflow:auto;margin:0}
.lb-h{font:400 1.7rem var(--fd);margin:30px 0 8px}
.lb-doc{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;margin:0 0 10px}
.lb-meta{font-size:.84rem;color:var(--mu)}
.lb-prog{margin:12px 0;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--sf2)}
.lb-bar{height:14px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--sf)}.lb-bar i{display:block;height:100%;background:var(--hl);transition:width .2s}
.lb-pm{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:.9rem;flex-wrap:wrap}
#lb-view{width:min(96vw,980px);max-height:94vh;padding:14px;overflow:auto;background:var(--sf);color:var(--tx)}
.lbv-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
#lbv-b canvas{max-width:100%;height:auto;display:block;margin:0 auto;border:1px solid var(--bd);background:#fff}
.lb-nopdf{margin:0 0 8px;font-size:.9rem;color:var(--mu)}
.sheet-lib{display:none}
.sheet-lib .lb-ph{font:600 1.5rem var(--fx);margin:0 0 4px}.sheet-lib .lb-pn{margin:0 0 14px;color:#555;font-size:.9rem}
.sheet-lib .lb-pp{break-inside:avoid-page;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid #bbb}.sheet-lib h4{margin:0 0 6px;font:700 .95rem var(--fb);color:#222}
.sheet-lib pre{white-space:pre-wrap;font:.92rem/1.5 var(--fb);color:#111;margin:0}
@media print{.lib-ui,#lb-view,.lb-note,#lb-prog{display:none!important}.sheet-lib{display:block!important;background:#fff;color:#111}}
</style>
