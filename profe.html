<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Profe Luján · Matemática</title>
<meta name="description" content="La Profe Luján te ayuda con Matemática: preguntale, mandale la foto de un ejercicio y mirá los gráficos paso a paso.">
<meta name="theme-color" content="#6b3a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Profe Luján">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{--wood:#6b3a1a;--wood2:#8a5a2b;--cream:#fff6e5;--paper:#fffdf7;--ink:#3b2a1a;--mu:#7a6650;--bd:#e4d3b5;--me:#ffe9b8;--red:#c1352f;--ok:#2f8f5b;--fd:'Fraunces',Georgia,serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#3a2412;color:var(--ink);font:16px/1.45 'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden}
.top{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 10px 0 12px;background:linear-gradient(#80491f,#6b3a1a);border-bottom:4px solid #4a2410;color:#fff3dc}
.who{display:flex;align-items:flex-end;gap:10px;min-width:0}
.av{display:block;height:78px;width:auto;transform-origin:50% 100%;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.tt{padding-bottom:12px;min-width:0}
.tt h1{margin:0;font:600 1.25rem/1.1 var(--fd);letter-spacing:.01em}
.tt p{margin:3px 0 0;font-size:.82rem;color:#f1d9b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;padding-bottom:12px}
.ib{width:42px;height:42px;border-radius:12px;border:2px solid #4a2410;background:#fff0d2;color:#4a2410;font-size:1.15rem;line-height:1;box-shadow:0 2px 0 #4a2410}
.ib:active{transform:translateY(1px);box-shadow:0 1px 0 #4a2410}
.av-festejo,.av-risa,.av-bien,.av-ok{animation:salto .8s ease}.av-error,.av-sorpresa{animation:sacudir .5s ease}
@keyframes salto{0%,100%{transform:translateY(0)}30%{transform:translateY(-7%)}60%{transform:translateY(0)}80%{transform:translateY(-2%)}}
@keyframes sacudir{0%,100%{transform:translateX(0)}25%{transform:translateX(-3%)}75%{transform:translateX(3%)}}
@media (prefers-reduced-motion:reduce){.av{animation:none!important}}
.inst{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff0c9;border-bottom:1px solid #f0cf86;font-size:.9rem}
.inst[hidden]{display:none}
.inst span{flex:1}
.inst button{border:0;border-radius:10px;padding:7px 12px;font-weight:700}
#inst-go{background:var(--red);color:#fff}#inst-x{background:transparent;font-size:1.1rem;padding:4px 8px}
#chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 6px;scroll-behavior:smooth;background:linear-gradient(#fffdf7,#fff8ea)}
.msg{display:flex;gap:8px;margin:10px 0;align-items:flex-end}
.msg.me{justify-content:flex-end}
.mav{flex:none;width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:#ffd9a0;border:2px solid #4a2410}
.bub{max-width:86%;padding:10px 13px;border-radius:16px;border:1px solid var(--bd);background:#fff;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.ia .bub{border-bottom-left-radius:4px}
.me .bub{background:var(--me);border-color:#f0cf86;border-bottom-right-radius:4px}
.bub b{font-weight:800}
.fig{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:6px;margin:8px 0;white-space:normal}
.fig svg{display:block;width:100%;height:auto}
.note{margin-top:8px;padding:7px 10px;border-radius:10px;background:#fff6e0;border:1px solid #f0dcae;font-size:.85rem;white-space:normal;color:#5b4630}
.note summary{cursor:pointer}
.ths{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ths img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px 42px}
.chip{border:2px solid var(--wood2);background:#fff;border-radius:999px;padding:7px 13px;font-size:.92rem;font-weight:700;color:var(--wood)}
.chip:active{background:#ffe9b8}
.aviso{margin:10px 0;padding:10px 12px;border-radius:12px;background:#fdeceb;border:1px solid #f1c3c0;color:#7a2420;font-size:.92rem}
.bar{flex:none;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:#fff4de}
.row{display:flex;gap:8px;align-items:flex-end}
.th{display:flex;gap:12px;flex-wrap:wrap;padding:2px 4px 10px}
.th[hidden]{display:none}
.t1{position:relative;width:60px;height:60px;border-radius:10px;border:2px solid #4a2410;background:#fffdf5}
.t1 img{display:block;width:100%;height:100%;object-fit:cover;border-radius:8px}
.t1 button{position:absolute;top:-10px;right:-10px;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid #4a2410;background:#fff0d2;color:#4a2410;font-size:11px;line-height:1}
#q{flex:1;min-width:0;resize:none;max-height:130px;border:2px solid var(--wood2);border-radius:20px;padding:10px 15px;font:inherit;background:#fff;color:var(--ink);outline:none}
#q:focus{border-color:var(--red)}
.rb{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid #4a2410;font-size:1.2rem;line-height:1;box-shadow:0 2px 0 #4a2410}
#att{background:#fff0d2;color:#4a2410}
#send{background:var(--red);color:#fff;border-color:#8c1f1b;box-shadow:0 2px 0 #8c1f1b}
.rb:disabled{opacity:.5;cursor:default}
.fine{margin:6px 4px 0;font-size:.74rem;color:var(--mu);text-align:center}
dialog{border:0;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));margin:auto auto 0;width:min(100%,760px);max-width:100%;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(40,20,5,.55)}
dialog h2{margin:0 0 10px;font:600 1.15rem var(--fd)}
dialog .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--bd);border-radius:14px;background:#fff;font-weight:700}
dialog .opt.pri{background:var(--red);border-color:#8c1f1b;color:#fff}
dialog input{display:block;width:100%;margin:8px 0;padding:11px 13px;border:2px solid var(--wood2);border-radius:12px;font:inherit;background:#fff}
dialog .msg-e{color:#a02722;font-size:.9rem;min-height:1.2em;margin:2px 0 4px}
dialog p{margin:6px 0}
dialog .mu{color:var(--mu);font-size:.88rem}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="who">
      <img id="av" class="av" src="img/profe-normal.webp" alt="La Profe Luján" width="56" height="78">
      <div class="tt"><h1>Profe Luján</h1><p id="sub">Tu profe de Matemática</p></div>
    </div>
    <div class="acts">
      <button type="button" class="ib" id="nueva" aria-label="Empezar una charla nueva" title="Charla nueva">🧹</button>
      <button type="button" class="ib" id="menu" aria-label="Menú" title="Menú">⋮</button>
    </div>
  </header>

  <div class="inst" id="inst" hidden>
    <span>📲 Instalá la app y abrila como cualquier otra.</span>
    <button type="button" id="inst-go">Instalar</button>
    <button type="button" id="inst-x" aria-label="Ahora no">✕</button>
  </div>

  <main id="chat" role="log" aria-live="polite" aria-label="Charla con la Profe"></main>

  <footer class="bar">
    <div class="th" id="th" hidden></div>
    <div class="row">
      <button type="button" class="rb" id="att" aria-label="Adjuntar una foto" title="Adjuntar una foto de tu carpeta o ejercicio">📷</button>
      <textarea id="q" rows="1" maxlength="700" placeholder="Preguntale a la Profe…" aria-label="Escribí tu pregunta" autocomplete="off" enterkeyhint="send"></textarea>
      <button type="button" class="rb" id="send" aria-label="Enviar">➤</button>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <p class="fine">La Profe es una IA y puede equivocarse: revisá siempre lo importante.</p>
  </footer>
</div>

<dialog id="sheet"><div id="sheet-c"></div></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="tutor.js"></script>
<script src="profe.js"></script>
<script src="profe-app.js"></script>
</body>
</html>
